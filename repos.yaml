# SYSTEM_NAME — repository manifest
#
# Single source of truth for which repos make up this system, how they relate,
# and how to fetch them. `workspace.sh` reads this file for every command.
#
# Child repos are created from the single-repo Python template and cloned into
# repos/ (gitignored). Each one stays a fully independent git repository.

system: SYSTEM_NAME
description: SYSTEM_DESCRIPTION

# The single-repo template every new service is scaffolded from.
# `./workspace.sh new <name> "<desc>"` clones this and runs its init-project.sh.
template:
  url: https://github.com/charlieLucke/python-template.git

# Default git host/owner used to expand short repo names into clone URLs.
defaults:
  owner: charlieLucke
  host: github.com
  branch: main

# The services that make up the system.
# - name:     repo + directory name under repos/
#   role:     one-line responsibility (mirrored into ROUTING.md)
#   url:      clone URL (optional; defaults to host/owner/name.git)
#   path:     checkout path (optional; defaults to repos/<name>)
#   consumes: which other services this one calls (for the dependency graph)
#   exposes:  contract file under contracts/ this service publishes (optional)
#   port:     local port, if it runs a service (optional)
#   pin:      commit SHA to pin to (optional; managed via `workspace.sh lock`)
services: []
  # - name: example-api
  #   role: HTTP API and domain logic
  #   consumes: []
  #   exposes: contracts/example-api.openapi.yaml
  #   port: 8000
  # - name: example-worker
  #   role: Background job processor
  #   consumes: [example-api]
  #   port: null
